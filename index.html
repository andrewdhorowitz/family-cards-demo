<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>My next two weeks</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #fdf8f2;
         color: #222; }
  header { padding: 16px; text-align: center; }
  h1 { font-size: 1.6rem; margin: 4px 0; }
  .tabs { display: none; gap: 8px; justify-content: center; padding: 0 12px 8px; }
  .tabs button { font-size: 1.1rem; padding: 10px 22px; border-radius: 999px;
                 border: 2px solid #b3541e; background: #fff; cursor: pointer; }
  .tabs button.active { background: #b3541e; color: #fff; }
  main { max-width: 560px; margin: 0 auto; padding: 0 12px 32px; }
  .day { background: #fff; border-radius: 16px; padding: 12px 14px;
         margin: 12px 0; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .day h2 { font-size: 1.15rem; margin: 0 0 4px; }
  .with { display: inline-block; font-weight: 700; border-radius: 999px;
          padding: 2px 10px; font-size: .9rem; }
  .with-dad { background: #ffe3c2; }
  .with-mom { background: #dbeafe; }
  .entry { border-top: 1px solid #eee; padding: 10px 0 4px; }
  .entry:first-of-type { border-top: none; }
  .title { font-size: 1.15rem; font-weight: 600; }
  .big .title { font-size: 1.35rem; }
  .big-badge { background: #b3541e; color: #fff; border-radius: 6px;
               padding: 1px 7px; font-size: .8rem; margin-left: 6px; }
  .changed { background: #dc2626; color: #fff; border-radius: 6px;
             padding: 1px 7px; font-size: .8rem; font-weight: 700;
             margin-left: 6px; }
  .time, .place, .leg { font-size: 1rem; margin-top: 2px; }
  .leg { font-weight: 600; }
  .quiet { color: #666; padding: 6px 0; }
  .demo-banner { background: #b3541e; color: #fff; font-weight: 700;
                 border-radius: 999px; padding: 4px 14px; font-size: .95rem;
                 max-width: 420px; margin: 8px auto 0; }
  .updated { color: #6f6f6f; font-size: .85rem; margin-top: 2px; }
  .updated-item { color: #6f6f6f; font-size: .8rem; margin-left: 6px; }
  .notebox { background: #fff7ea; border: 2px dashed #b3541e;
             border-radius: 16px; padding: 14px; margin: 16px 0; opacity: .75; }
  .notebox h2 { font-size: 1.2rem; margin: 0 0 6px; }
  .notebox p { margin: 0 0 10px; color: #555; font-size: .95rem; }
  .notebox textarea { width: 100%; box-sizing: border-box; font-size: 1.05rem;
             padding: 10px; border-radius: 10px; border: 1px solid #ccc;
             min-height: 64px; }
  .notebox .row { display: flex; gap: 8px; margin-top: 8px; }
  .notebox input[type="date"], .notebox input[type="time"] { flex: 1;
             font-size: 1rem; padding: 10px; border-radius: 10px;
             border: 1px solid #ccc; }
  .notebox button { background: #b3541e; color: #fff; border: none;
             font-size: 1.05rem; padding: 10px 22px; border-radius: 999px; }
</style>
</head>
<body>
<header><h1 id="heading">My next two weeks</h1>
<div class="updated" id="updated"></div>
<div class="demo-banner" id="demo-banner" style="display:none">Demo — fake kids, fake plans, just for show</div></header>
<nav class="tabs" id="tabs"></nav>
<main id="card"></main>
<script>
let cards = {};                                // slug -> data (all from JSON)

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtStamp(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  const datePart = d.toLocaleDateString("en-US",
    { weekday: "short", month: "short", day: "numeric",
      timeZone: "America/New_York" });
  const timePart = d.toLocaleTimeString("en-US",
    { hour: "numeric", minute: "2-digit", timeZone: "America/New_York" });
  return datePart + " \u00b7 " + timePart;
}
function stamp(data) {
  const iso = data.last_changed_at || data.generated_at;
  return iso ? "Last changed: " + fmtStamp(iso) : "";
}
function render(data) {
  document.getElementById("heading").textContent =
    data.kid + " — next two weeks";
  document.getElementById("updated").textContent = stamp(data);
  const main = document.getElementById("card");
  main.innerHTML = data.days.map(day => {
    const entries = day.entries.length ? day.entries.map(e => `
      <div class="entry ${e.big ? "big" : ""}">
        <div><span class="title">${esc(e.title)}</span>
          ${e.big ? '<span class="big-badge">Big</span>' : ""}
          ${e.changed ? '<span class="changed">CHANGED</span>' : ""}
          ${e.changed && e.changed_at ? `<span class="updated-item">Updated ${esc(fmtStamp(e.changed_at))}</span>` : ""}
        </div>
        <div class="time">🕒 ${esc(e.time_label)}</div>
        ${e.place ? `<div class="place">📍 ${esc(e.place)}</div>` : ""}
        ${e.changed_note ? `<div class="leg">${esc(e.changed_note)}</div>` : ""}
        ${e.legs.map(l => `<div class="leg">🚗 ${esc(l.driver)} ${l.kind === "pickup"
            ? "picks you up" : "drops you off"} — ${esc(l.time_label)}</div>`).join("")}
      </div>`).join("") : '<div class="quiet">Nothing planned</div>';
    return `<section class="day"><h2>${esc(day.label)}</h2>
      <span class="with with-${day.with.toLowerCase()}">With ${esc(day.with)}</span>
      ${entries}</section>`;
  }).join("") + demoNoteBoxHtml;
}
const demoNoteBoxHtml = `<section class="notebox">
  <h2>📝 Anything on your side?</h2>
  <p>Something scheduled, or something you expect, that isn't here? Tell Dad — he'll see it.</p>
  <textarea disabled aria-label="Your note" placeholder="e.g. Sleepover at a friend's Friday night"></textarea>
  <div class="row"><input type="date" disabled aria-label="Date (optional)"></div>
  <div class="row"><input type="time" disabled><input type="time" disabled></div>
  <p style="margin-top:8px">Date and times are optional — a guess is fine.</p>
  <div class="row"><button type="button" disabled>Tell Dad</button></div>
  <p style="margin-top:8px"><strong>Demo — notes are turned off here.</strong></p>
</section>`;
async function load() {
  // Where a gate runs (Cloudflare), it tells us who is looking via
  // scope.json: a kid scope sees only her own card; parent/owner see
  // every card with tabs. On plain static hosting (GitHub Pages) there
  // is no gate and scope.json is absent — the demo then runs OPEN:
  // both cards with tabs, no code needed. All fetches are relative so
  // the page works under a subpath like /family-cards-demo/.
  let scope = null;
  try {
    const scopeResp = await fetch("scope.json");
    if (scopeResp.ok) ({ scope } = await scopeResp.json());
  } catch (e) { /* no gate answering on this host */ }
  if (scope && scope !== "parent" && scope !== "owner") {
    const data = await (await fetch(scope + ".json")).json();
    render(data);
    return;
  }
  if (!scope) document.getElementById("demo-banner").style.display = "block";
  const manifest = await (await fetch("manifest.json")).json();
  for (const file of manifest.cards) {
    cards[file.replace(".json", "")] = await (await fetch(file)).json();
  }
  const slugs = Object.keys(cards);
  if (slugs.length > 1) {
    const tabs = document.getElementById("tabs");
    tabs.style.display = "flex";
    slugs.forEach((slug, i) => {
      const b = document.createElement("button");
      b.textContent = cards[slug].kid;
      if (i === 0) b.classList.add("active");
      b.onclick = () => {
        tabs.querySelectorAll("button").forEach(x => x.classList.remove("active"));
        b.classList.add("active");
        render(cards[slug]);
      };
      tabs.appendChild(b);
    });
    render(cards[slugs[0]]);
  } else {
    render(cards[slugs[0]]);
  }
}
load();
</script>
</body>
</html>
