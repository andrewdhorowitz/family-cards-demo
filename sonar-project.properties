# SonarCloud project configuration — repo-template kit (kit v3.13).
# Carried at the repo root from the template; read by the SonarCloud
# workflow (.github/workflows/sonar.yml) once the repo is wired.
#
# >>> REPLACE BOTH PLACEHOLDERS when the owner wires SonarCloud <<<
# The values are created on sonarcloud.io when the project is set up
# there (the GitHub onboarding proposes sonar.projectKey as
# <org>_<repo>). Until both lines hold real values, the workflow's
# preflight reports the repo as not wired and the analysis skips —
# green by design. The setup script's SonarCloud step reads the same
# placeholders to report the wiring state.
sonar.organization=andrewdhorowitz
sonar.projectKey=andrewdhorowitz_family-cards-demo

# What gets analysed: the repo root by default. Narrow it per project
# if generated or vendored code should stay out of the analysis, e.g.
# sonar.sources=src
# sonar.exclusions=**/vendor/**,**/*.min.js
sonar.sourceEncoding=UTF-8
